# ==============================================================================
# Local Sandbox Environment generated by Clouderator AI
# Project: Fintech Payment Gateway (Cost-Optimized)
# Services on Canvas: Route53 Standard DNS, CloudFront Standard, Internal Application Gateway, Auto Scaling Group (Burstable), Encrypted Single-AZ Ledger DB, Immutable Audit Vault
# Run with: docker compose up -d
# ==============================================================================

version: '3.8'

services:
  app-server-1:
    image: node:20-alpine
    container_name: clouderator-app-1
    working_dir: /usr/src/app
    command: npm start
    ports:
      - "8081:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://clouderator:secret123@postgres:5432/app_db
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://localstack:4566
    depends_on:
      - postgres
      - redis
      - localstack

  app-server-2:
    image: node:20-alpine
    container_name: clouderator-app-2
    working_dir: /usr/src/app
    command: npm start
    ports:
      - "8082:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://clouderator:secret123@postgres:5432/app_db
      - REDIS_URL=redis://redis:6379
      - S3_ENDPOINT=http://localstack:4566
    depends_on:
      - postgres
      - redis
      - localstack

  nginx-lb:
    image: nginx:alpine
    container_name: clouderator-load-balancer
    ports:
      - "80:80"
    depends_on:
      - app-server-1
      - app-server-2

  postgres:
    image: postgres:16-alpine
    container_name: clouderator-postgres
    environment:
      POSTGRES_USER: clouderator
      POSTGRES_PASSWORD: secret123
      POSTGRES_DB: app_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: clouderator-redis
    ports:
      - "6379:6379"

  localstack:
    image: localstack/localstack:latest
    container_name: clouderator-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3

volumes:
  postgres_data:
