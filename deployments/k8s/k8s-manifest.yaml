apiVersion: apps/v1
kind: Deployment
metadata:
  name: food-delivery-app-deployment
  labels:
    app: food-delivery-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: food-delivery-app
  template:
    metadata:
      labels:
        app: food-delivery-app
    spec:
      containers:
      - name: backend
        image: food-delivery-app/backend:v1.0.0
        resources:
          limits:
            cpu: "2000m"
            memory: "4096Mi"
          requests:
            cpu: "500m"
            memory: "1024Mi"
        ports:
        - containerPort: 8080
        env:
        - name: NODE_ENV
          value: "production"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: food-delivery-app-service
spec:
  type: NodePort
  selector:
    app: food-delivery-app
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: food-delivery-app-ingress
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    kubernetes.io/ingress.class: "nginx"
spec:
  tls:
  - hosts:
    - food-delivery-app.internal
    secretName: food-delivery-app-tls-cert
  rules:
  - host: food-delivery-app.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: food-delivery-app-service
            port:
              number: 80}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-cache
spec:
  serviceName: "redis"
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
